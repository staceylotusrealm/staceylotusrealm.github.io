<style>
:root{
  --sun:#FFB627; --ember:#F2683C; --rose:#E2467E; --violet:#7B4BA8;
  --ink:#2C1B3D; --ink-soft:#5C4B6B; --ink-mute:#8B7C97;
  --cream:#FFFAF2; --shell:#FFFFFF;
  --display:"Fraunces",ui-serif,Georgia,serif;
  --sans:"Karla",ui-sans-serif,system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--cream); color:var(--ink);
  font-family:var(--sans);
  display:flex; align-items:center; justify-content:center;
  padding:clamp(16px,4vmin,48px);
  overflow:hidden;
}
.bg{position:fixed; inset:0; pointer-events:none; overflow:hidden}
.glow{position:absolute; border-radius:50%; filter:blur(80px); opacity:.55}
.g1{width:72vmin;height:72vmin;left:-18vmin;top:-16vmin;background:radial-gradient(circle,#FFD98A,transparent 68%)}
.g2{width:66vmin;height:66vmin;right:-20vmin;top:-10vmin;background:radial-gradient(circle,#F7B7D3,transparent 68%)}
.g3{width:70vmin;height:70vmin;left:26vmin;bottom:-26vmin;background:radial-gradient(circle,#A8E3DF,transparent 70%)}

.card{
  position:relative;
  width:min(100%, 62vh);
  background:var(--shell);
  border-radius:clamp(24px,4vmin,44px);
  box-shadow:0 30px 80px rgba(44,27,61,.16), 0 2px 10px rgba(44,27,61,.05);
  padding:clamp(26px,5vmin,52px) clamp(24px,5vmin,52px) clamp(22px,4vmin,42px);
  text-align:center;
  display:flex; flex-direction:column; align-items:center;
  gap:clamp(16px,3vmin,28px);
}

.mark{width:clamp(44px,8vmin,72px); height:auto; display:block}

.brand{line-height:1}
.brand .name{
  font-family:var(--display); font-weight:700;
  font-size:clamp(1.7rem,5.2vmin,2.9rem);
  letter-spacing:-.02em;
}
.brand .who{
  margin-top:.55em;
  font-size:clamp(.62rem,1.5vmin,.82rem);
  font-weight:700; letter-spacing:.3em; text-transform:uppercase;
  color:var(--ink-mute);
}

.rule{
  width:clamp(40px,7vmin,64px); height:3px; border-radius:3px;
  background:linear-gradient(90deg,var(--sun),var(--ember),var(--rose));
}

.qr{
  width:min(82%,380px); height:auto; display:block;
  border-radius:12px;
}

.ask{
  font-family:var(--display); font-weight:600; font-style:italic;
  font-size:clamp(1.05rem,2.9vmin,1.5rem);
  color:var(--ink);
}
.services{
  font-size:clamp(.6rem,1.45vmin,.78rem);
  font-weight:700; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ember); line-height:1.9;
}
.foot{
  margin-top:auto; padding-top:clamp(10px,2vmin,18px);
  border-top:1px solid rgba(44,27,61,.1);
  width:100%;
  display:flex; flex-direction:column; gap:.4em;
}
.url{
  font-family:var(--display); font-weight:700;
  font-size:clamp(.85rem,2.1vmin,1.1rem); color:var(--ink);
  word-break:break-word;
}
.handle{
  font-size:clamp(.7rem,1.6vmin,.86rem); color:var(--ink-mute); font-weight:600;
}

@media print{
  body{background:#fff; padding:0; height:auto}
  .bg{display:none}
  .card{box-shadow:none; border:1px solid #E7DED2; width:100%}
}
</style>
</head>
